# CNB 仓库 UI 定制
# 文档：https://docs.cnb.cool/zh/repo/settings-workspace.html
workspace:
  launch:
    # 「云原生开发」按钮文案，点击即进入环境
    button:
      name: 在线预览 index.html
      description: 启动预览环境，浏览器直接打开 index.html（CNB CI/CD Dashboard）
    # 预览环境 1 核足够（纯静态文件服务）
    cpus: 1
    # 环境就绪后自动打开 WebIDE（在 PORTS 面板可拿到 8686 的在线地址）
    autoOpenWebIDE: true
