<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudClipboard · UI Audit Test Page</title>
  <style>
    :root {
      --radius-xs: 8px;
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      margin: 0;
      background: #f2f4f7;
      color: #1d1d1f;
    }
    .nav {
      display: flex;
      align-items: center;
      gap: var(--space-5);
      padding: var(--space-4) var(--space-8);
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(0,0,0,.08);
      position: sticky;
      top: 0;
    }
    .nav .logo { font-weight: 700; font-size: 18px; }
    .nav .links { display: flex; gap: var(--space-5); }
    .nav .link {
      color: inherit; text-decoration: none;
      font-size: 14px; padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-xs);
    }
    .nav .link.active { background: rgba(10,132,255,.1); color: #0a84ff; }

    .container { max-width: 960px; margin: 0 auto; padding: var(--space-8) var(--space-4); }
    .hero { text-align: center; padding: var(--space-8) 0; }
    .hero h1 { font-size: 36px; margin: 0 0 var(--space-3); }
    .hero p { color: rgba(29,29,31,.6); margin: 0; }

    .card {
      background: #fff;
      border-radius: var(--radius-md);
      padding: var(--space-5);
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
      margin-bottom: var(--space-5);
    }
    .card h3 { margin: 0 0 var(--space-3); font-size: 17px; }
    .card p { margin: 0; color: rgba(29,29,31,.7); font-size: 14px; line-height: 1.5; }

    /* 卡片 A：使用标准 spacing token */
    .card-arbitrary-padding { padding: var(--space-4); }
    /* 卡片 B：使用标准 radius token */
    .card-arbitrary-radius { border-radius: var(--radius-md); }

    .btn-row { display: flex; gap: var(--space-3); margin-top: var(--space-5); }
    .btn {
      padding: var(--space-2) var(--space-4);
      border: none; border-radius: var(--radius-sm);
      font-size: 14px; font-weight: 500; cursor: pointer;
      background: #0a84ff; color: #fff;
    }
    .btn.secondary { background: rgba(0,0,0,.05); color: #1d1d1f; }
    /* 按钮：使用标准 radius token */
    .btn-arbitrary-radius { border-radius: var(--radius-sm); }

    /* 网格：三个卡片等宽对齐 */
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-5); margin-top: var(--space-6); }
    .grid .card { margin-bottom: 0; }

    .list { margin-top: var(--space-6); }
    .list .item {
      display: flex; align-items: center; gap: var(--space-3);
      padding: var(--space-4);
      background: #fff; border-radius: var(--radius-sm);
      margin-bottom: var(--space-3);
    }
    /* item：使用标准 spacing token */
    .item-arbitrary-margin { margin-top: var(--space-3); }
    .list .item .icon {
      width: 36px; height: 36px; border-radius: 999px;
      background: rgba(10,132,255,.12);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .list .item .icon svg { width: 18px; height: 18px; }

    .footer {
      margin-top: var(--space-8);
      padding: var(--space-6);
      background: rgba(0,0,0,.04);
      border-radius: var(--radius-lg);
      text-align: center;
      color: rgba(29,29,31,.5);
      font-size: 13px;
    }

    /* 表单区域：标签与输入框 gap 使用标准 spacing token */
    .form { margin-top: var(--space-6); }
    .form .field { display: flex; flex-direction: column; gap: var(--space-2); margin-bottom: var(--space-4); }
    .form label { font-size: 13px; color: rgba(29,29,31,.6); }
    .form input {
      padding: var(--space-2) var(--space-3);
      border: 1px solid rgba(0,0,0,.12);
      border-radius: var(--radius-xs);
      font-size: 14px;
    }

    /* 大按钮：使用标准 radius token */
    .btn-cta { border-radius: var(--radius-sm); padding: var(--space-3) var(--space-8); background: #0a84ff; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="logo">📋 CloudClipboard</div>
    <div class="links">
      <a class="link active" href="#dashboard">仪表盘</a>
      <a class="link" href="#clipboard">剪贴板</a>
      <a class="link" href="#devices">设备</a>
      <a class="link" href="#settings">设置</a>
    </div>
  </nav>

  <div class="container">
    <section class="hero">
      <h1>个人通用剪贴板</h1>
      <p>PWA + E2EE 加密，你的剪贴板随处可用</p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-cta">立即开始</button>
        <button class="btn secondary">了解更多</button>
      </div>
    </section>

    <section class="grid">
      <article class="card card-wide">
        <h3>同步状态</h3>
        <p>所有设备实时同步，端到端加密保护。</p>
        <div class="btn-row">
          <button class="btn">查看详情</button>
        </div>
      </article>
      <article class="card card-arbitrary-padding">
        <h3>最近剪贴板</h3>
        <p>最新的剪贴内容会自动加密保存。</p>
        <div class="btn-row">
          <button class="btn">浏览</button>
        </div>
      </article>
      <article class="card card-arbitrary-radius">
        <h3>设备管理</h3>
        <p>管理所有已授权的设备连接。</p>
        <div class="btn-row">
          <button class="btn secondary">管理</button>
        </div>
      </article>
    </section>

    <section class="form">
      <div class="card">
        <h3>快速推送</h3>
        <div class="field">
          <label for="content">内容</label>
          <input id="content" type="text" placeholder="粘贴内容...">
        </div>
        <div class="field">
          <label for="device">目标设备</label>
          <input id="device" type="text" placeholder="选择设备...">
        </div>
        <div class="btn-row">
          <button class="btn btn-arbitrary-radius">发送到设备</button>
        </div>
      </div>
    </section>

    <section class="list">
      <h2 style="font-size:20px;">已连接设备</h2>
      <div class="item">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none"><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z" fill="#0a84ff"/></svg></div>
        <div><strong>MacBook Pro</strong><br><span style="color:rgba(29,29,31,.5);font-size:13px;">macOS · 在线</span></div>
      </div>
      <div class="item item-arbitrary-margin">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none"><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z" fill="#34c759"/></svg></div>
        <div><strong>iPhone 15</strong><br><span style="color:rgba(29,29,31,.5);font-size:13px;">iOS · 在线</span></div>
      </div>
      <div class="item">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none"><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z" fill="#ff9500"/></svg></div>
        <div><strong>Windows 工作站</strong><br><span style="color:rgba(29,29,31,.5);font-size:13px;">Windows · 离线</span></div>
      </div>
    </section>

    <footer class="footer">
      © 2026 CloudClipboard · 个人通用剪贴板
    </footer>
  </div>
</body>
</html>
