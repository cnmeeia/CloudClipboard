name: iOS Release（未签名 IPA）

# 推送到 release-ios 分支（或手动触发）时：
# 在 macOS runner 上无签名构建 iOS App，打包为 IPA 并创建 GitHub Release。
#
# 注意：产物为未签名 IPA，仅用于验证构建流程，不可安装到真机。
# 需要可安装版本时，请按 apps/ios/README.md 接入签名后重新触发。

on:
  push:
    branches: ["release-ios"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: 构建未签名 IPA 并发布
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: |
          cd apps/ios
          xcodegen generate

      # 与 scripts/build-ios.sh ci 等价，但保留完整日志（脚本内 tail -40 会截断错误信息）
      - name: 构建（无签名，保留完整日志）
        run: |
          set -o pipefail
          cd apps/ios
          xcodebuild -project CloudClipboard.xcodeproj \
            -scheme CloudClipboard \
            -configuration Debug \
            -derivedDataPath "${PWD}/build" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "${GITHUB_WORKSPACE}/xcodebuild.log"

      - name: 上传完整构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7

      - name: 打包 IPA（Payload 结构，未签名）
        run: |
          set -euo pipefail
          APP_DIR="apps/ios/build/Build/Products/Debug-iphoneos"
          APP="$(find "$APP_DIR" -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP" || { echo "::error::未找到 .app 产物"; exit 1; }
          echo "使用产物：$APP"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../CloudClipboard-unsigned.ipa Payload)
          ls -lh CloudClipboard-unsigned.ipa

      - name: 创建 GitHub Release 并上传 IPA（tag 自动递增）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 取远端最大的 ios-vX.Y.Z，patch 自动 +1；没有则从 v1.0.0 开始
          LATEST=$(git ls-remote --tags origin \
            | awk '{print $2}' \
            | grep -E '^refs/tags/ios-v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's|refs/tags/||' \
            | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            TAG="ios-v1.0.0"
          else
            V=${LATEST#ios-v}
            TAG="ios-v${V%.*}.$((10#${V##*.} + 1))"
          fi
          echo "发布 tag：$TAG（上一个：${LATEST:-无}）"
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" CloudClipboard-unsigned.ipa \
            --title "CloudClipboard iOS ${TAG#ios-}（未签名）" \
            --notes-file .github/release-notes-ios.md
          echo "Release 已创建：$(gh release view "$TAG" --json url -q .url)"