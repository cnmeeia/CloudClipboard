<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Clipboard" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-152.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <title>CloudClipboard</title>
    <script>
      // 样式自愈：旧版 Service Worker 可能把 Cloudflare Access 登录页 HTML
      // 误当成 CSS 缓存，导致整页无样式。启动后探测一个必然存在的 CSS 变量，
      // 若样式表未生效，则注销全部 SW、清空 Cache Storage 后重载一次恢复。
      ;(function () {
        function recover() {
          var probe = getComputedStyle(document.documentElement)
            .getPropertyValue("--radius-md").trim()
          var broken = !probe
          var flag = "cc_style_boot"
          if (broken && !sessionStorage.getItem(flag)) {
            sessionStorage.setItem(flag, "1")
            Promise.resolve()
              .then(function () {
                if ("serviceWorker" in navigator) {
                  return navigator.serviceWorker.getRegistrations().then(function (regs) {
                    return Promise.all(regs.map(function (r) { return r.unregister() }))
                  })
                }
              })
              .then(function () {
                if (window.caches) {
                  return caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return caches.delete(k) }))
                  })
                }
              })
              .then(function () { location.reload() })
          } else if (!broken && sessionStorage.getItem(flag)) {
            sessionStorage.removeItem(flag)
          }
        }
        window.addEventListener("load", function () { setTimeout(recover, 800) })
      })()
    </script>
    <script>
      // 主题首帧预置（FOUC 修复 · A4）：在首次绘制前设置 data-theme，
      // 避免深色用户看到一帧浅色闪烁（React 挂载后 useEffect 才应用主题）。
      ;(function () {
        try {
          var raw = localStorage.getItem("cloudclip_config")
          var theme = raw ? (JSON.parse(raw).theme || "system") : "system"
          var dark =
            theme === "dark" ||
            (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.dataset.theme = dark ? "dark" : "light"
        } catch (e) {
          document.documentElement.dataset.theme = "light"
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
