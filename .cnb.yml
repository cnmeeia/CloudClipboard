main:
  push:
    # 分支匹配：只有推送到 main 分支才会触发
    - name: ui-audit-test
      docker:
        image: node:22
      # 密钥最小暴露：只在真正需要发通知/触发外部构建的流水线里引用
      imports:
        - https://cnb.cool/cnmeeia/mikey/-/blob/main/bark.yml
      stages:
        # ---------- 正式任务：安装依赖 + UI 审计 ----------
        - name: install
          script: |
            set -eu
            npm install
            npx playwright install --with-deps chromium

        - name: run-ui-audit
          script: |
            set -eu
            echo "=== Web Design OS UI Audit Engine Test ==="
            echo "1. Structured UI Audit (real rules: ALIGN/SPACE/RADIUS)"
            npm run polish -- scripts/test-page.html
            echo "2. Full Audit"
            npm run audit -- scripts/test-page.html
            echo "--- reports ---"
            ls -la reports/ || true
            echo "=== UI Audit Engine Test Complete ==="

        # ---------- 成功通知：必须是 stages 最后一个任务，只有前面全过才会走到这里 ----------
        - name: bark-notify-success
          script: |
            curl -sS -m 10 -X POST "$BARK_URL/$BARK_KEY" \
              -H 'Content-Type: application/json' \
              -d "{\"title\":\"cnb 编译通过\",\"body\":\"$CNB_REPO_SLUG @ $CNB_BRANCH ($CNB_COMMIT_SHORT)\"}" > /dev/null
            echo "已发送成功通知"

        # ---------- 触发 GitHub Actions 重建 ----------
        - name: trigger-github-action
          imports:
            - https://cnb.cool/cnmeeia/mikey/-/blob/main/github.yml
          script: |
            set -eu
            if [ -z "${GITHUB_URL:-}" ] || [ -z "${GITHUB_KEY:-}" ]; then
              echo "未配置 GITHUB_URL / GITHUB_KEY，跳过触发 GitHub Actions"
              echo "→ 请在密钥仓库 mikey 的 bark.yml 中补上这两个变量，或改成本仓库的仓库级密钥"
              exit 0
            fi
            # -sS 静默但保留错误；-o 丢弃响应体，避免把 token/响应内容写进日志
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GITHUB_KEY" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_URL" \
              -d '{"ref":"main"}')
            case "$code" in
              2??) echo "已触发 GitHub Actions，HTTP $code" ;;
              *)   echo "触发失败，HTTP $code"; exit 1 ;;
            esac

      # ---------- 失败通知：只有 stages 失败时才会执行 ----------
      failStages:
        - name: bark-notify-failure
          script: |
            curl -sS -m 10 -X POST "$BARK_URL/$BARK_KEY" \
              -H 'Content-Type: application/json' \
              -d "{\"title\":\"UI Audit 失败\",\"body\":\"$CNB_REPO_SLUG @ $CNB_BRANCH ($CNB_COMMIT_SHORT) 失败\"}" > /dev/null
            echo "已发送失败通知"

# Tag 推送时只发一条通知，不跑 UI 测试（tag_push 属仓库级事件，必须挂在 $ 兜底分支下）
$:
  tag_push:
    - name: tag-notify
      imports:
        - https://cnb.cool/cnmeeia/mikey/-/blob/main/bark.yml
      stages:
        - name: bark-notify-tag
          script: |
            curl -sS -m 10 -X POST "$BARK_URL/$BARK_KEY" \
              -H 'Content-Type: application/json' \
              -d "{\"title\":\"CNB Tag 通知\",\"body\":\"$CNB_REPO_SLUG tag $CNB_BRANCH\"}" > /dev/null
            echo "Bark 通知已发送"
